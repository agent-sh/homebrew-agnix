name: Verify Formula for Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, such as v0.55.0
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare formula to release archive
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          URL="https://github.com/agent-sh/agnix/archive/refs/tags/${TAG}.tar.gz"
          SHA="$(curl -fsSL --retry 3 "$URL" | sha256sum | awk '{print $1}')"
          grep -Fqx "  url \"$URL\"" Formula/agnix.rb
          grep -Fqx "  sha256 \"$SHA\"" Formula/agnix.rb
          echo "Formula matches ${TAG} and its source archive SHA-256"
